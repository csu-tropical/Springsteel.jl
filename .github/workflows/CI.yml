name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  parity-check:
    name: Test group parity (runtests.jl ↔ CI matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Check that test/runtests.jl and CI matrix list the same groups
        run: julia .github/scripts/check_test_group_parity.jl

  test:
    needs: parity-check
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'     # Latest stable
        os:
          - ubuntu-latest
        arch:
          - x64
        group:
          - basis
          - banded_cholesky
          - grids
          - cell_counts
          - transforms
          - tiling
          - io
          - solver
          - solver_problem
          - operator_algebra
          - mubar
          - interpolation
          - filtering
          - r3x
          - bc
          - multipatch
          - nesting_support
          - tile_multipatch
          - basis_cache
          - relocation
          - positivity
          - reference_state
          - thermodynamics
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        shell: julia --color=yes --project {0}
        run: |
          using Pkg
          Pkg.instantiate()

      - name: Run tests
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: julia --code-coverage=user --color=yes --project test/runtests.jl

      - uses: julia-actions/julia-processcoverage@v1

      - uses: codecov/codecov-action@v4
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Exercises the lowest Julia version [compat] claims to support. The rest of the
  # matrix runs on '1' (latest stable), so without this job the declared floor is a
  # claim nothing checks. It went wrong exactly that way once: Project.toml declared
  # julia = "1.9" while Krylov 0.10 requires >= 1.10, so `Pkg.add("Springsteel")` was
  # unsatisfiable on 1.9 for the whole v1.0/v1.1 line, and only General's AutoMerge
  # (which resolves on the lowest compatible version) noticed.
  #
  # Manifest.toml is gitignored, so Pkg.instantiate() resolves from scratch here —
  # that resolve IS the test. Keep this version in step with [compat] julia; if the
  # floor is raised and this is not, instantiate fails because the compat bound
  # excludes the runner's version, so the two cannot silently drift.
  #
  # Deliberately not gated on parity-check: a group-name typo should not be able to
  # hide a dependency-resolution regression.
  minimum-julia:
    name: Minimum supported Julia (1.10) - full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
          arch: x64

      - uses: julia-actions/cache@v2

      - name: Resolve and instantiate on the compat floor
        shell: julia --color=yes --project {0}
        run: |
          using Pkg
          Pkg.instantiate()

      - name: Load the package
        run: julia --color=yes --project -e 'using Springsteel; println("loaded Springsteel on ", VERSION)'

      - name: Run the full test suite
        run: julia --color=yes --project test/runtests.jl
